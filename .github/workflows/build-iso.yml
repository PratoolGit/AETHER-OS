name: Build AETHER OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"

concurrency:
  group: aether-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build x86_64 live ISO
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate profile and shell scripts
        run: bash scripts/check-profile.sh

      - name: Build with Arch Linux and archiso
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/.work"
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -Eeuo pipefail -c '
              pacman -Syu --noconfirm
              pacman -S --needed --noconfirm archiso
              mkarchiso -v -w /workspace/.work -o /workspace/out /workspace/profile

              # Query the built image, not only the requested package list.
              localdb="/workspace/.work/x86_64/airootfs/var/lib/pacman/local"
              if [[ ! -d "$localdb" ]]; then
                echo "ERROR: the built image package database is missing." >&2
                exit 1
              fi
              for package in udisks2 gvfs gvfs-mtp thunar-volman; do
                if find "$localdb" -maxdepth 1 -type d -name "$package-*" -print -quit | grep -q .; then
                  echo "ERROR: $package was pulled into the live image." >&2
                  exit 1
                fi
              done

              cd /workspace/out
              sha256sum *.iso > SHA256SUMS
            '

      - name: Install UEFI VM test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf

      - name: Boot ISO in a UEFI virtual machine
        run: bash scripts/vm-smoke-test.sh

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: aether-os-alpha-0.1-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
