name: Build AETHER OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"

concurrency:
  group: aether-iso-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build x86_64 live ISO
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate profile and shell scripts
        run: bash scripts/check-profile.sh

      - name: Build with current Arch Linux and archiso
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/.work"
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -Eeuo pipefail -c '
              pacman -Syu --noconfirm
              pacman -S --needed --noconfirm archiso
              mkarchiso -v -w /workspace/.work -o /workspace/out /workspace/profile

              # Verify the built root filesystem, not just requested package names.
              airootfs="/workspace/.work/x86_64/airootfs"
              localdb="$airootfs/var/lib/pacman/local"
              modules_dir="$airootfs/usr/lib/modules"
              firmware_dir="$airootfs/usr/lib/firmware"
              if [[ ! -d "$localdb" || ! -d "$modules_dir" ]]; then
                echo "ERROR: built image package database or kernel modules are missing." >&2
                exit 1
              fi

              for package in udisks2 gvfs gvfs-mtp thunar-volman; do
                if find "$localdb" -maxdepth 1 -type d -name "$package-*" -print -quit | grep -q .; then
                  echo "ERROR: $package was pulled into the live image." >&2
                  exit 1
                fi
              done

              # Include microcode for both AMD and Intel x86_64 systems.
              for package in amd-ucode intel-ucode; do
                if ! find "$localdb" -maxdepth 1 -type d -name "$package-*" -print -quit | grep -q .; then
                  echo "ERROR: required CPU microcode package is missing: $package" >&2
                  exit 1
                fi
              done

              alias_files=("$modules_dir"/*/modules.alias)
              if (( ${#alias_files[@]} == 0 )); then
                echo "ERROR: kernel modules.alias was not generated." >&2
                exit 1
              fi

              # ASUS reference laptop: MediaTek MT7902 PCIe Wi-Fi (14c3:7902).
              if ! grep -Eiq "pci:v000014C3d00007902.*mt7921e" "${alias_files[@]}"; then
                echo "ERROR: MT7902 Wi-Fi alias is absent from the built kernel." >&2
                exit 1
              fi

              # MT7902 Bluetooth support is stored in btusb's internal quirks_table,
              # not necessarily exported to modules.alias. Inspect the compiled modules.
              btusb_module=$(find "$modules_dir" -type f -name "btusb.ko*" -print -quit)
              btmtk_module=$(find "$modules_dir" -type f -name "btmtk.ko*" -print -quit)
              if [[ -z "$btusb_module" || -z "$btmtk_module" ]]; then
                echo "ERROR: btusb or btmtk kernel module is missing." >&2
                exit 1
              fi

              python3 - "$btusb_module" "$btmtk_module" <<PY
              import subprocess
              import sys

              def module_bytes(path):
                  if path.endswith(".zst"):
                      command = ["zstd", "-q", "-d", "-c", path]
                  elif path.endswith(".xz"):
                      command = ["xz", "-d", "-c", path]
                  else:
                      command = ["cat", path]
                  return subprocess.run(command, check=True, stdout=subprocess.PIPE).stdout

              btusb = module_bytes(sys.argv[1])
              btmtk = module_bytes(sys.argv[2])

              # USB_DEVICE(0x13d3, 0x3579): match flags + vendor + product,
              # encoded in the compiled struct usb_device_id (little-endian).
              if bytes.fromhex("03 00 d3 13 79 35") not in btusb:
                  raise SystemExit("ERROR: compiled btusb module lacks the MT7902 13d3:3579 quirk-table entry.")

              # Confirm that the MediaTek transport knows the MT7902 firmware name.
              firmware_ref = b"mediatek/BT_RAM_CODE_MT7902_1_1_hdr.bin"
              if firmware_ref not in btmtk:
                  raise SystemExit("ERROR: compiled btmtk module lacks the MT7902 firmware reference.")

              print("PASS: compiled btusb module contains MT7902 USB ID 13d3:3579.")
              print("PASS: compiled btmtk module references the MT7902 Bluetooth firmware.")
              PY

              for firmware in \
                mediatek/WIFI_MT7902_patch_mcu_1_1_hdr.bin.zst \
                mediatek/WIFI_RAM_CODE_MT7902_1.bin.zst \
                mediatek/BT_RAM_CODE_MT7902_1_1_hdr.bin.zst; do
                if [[ ! -f "$firmware_dir/$firmware" ]]; then
                  echo "ERROR: required MT7902 firmware is missing: $firmware" >&2
                  exit 1
                fi
              done

              # Confirm AMD APU graphics support is present in the shipped kernel/rootfs.
              if ! find "$modules_dir" -type f -name "amdgpu.ko*" -print -quit | grep -q .; then
                echo "ERROR: AMDGPU kernel module is missing." >&2
                exit 1
              fi
              if [[ ! -d "$firmware_dir/amdgpu" ]]; then
                echo "ERROR: AMDGPU firmware directory is missing." >&2
                exit 1
              fi
              if [[ ! -f "$airootfs/usr/lib/dri/radeonsi_dri.so" ]]; then
                echo "ERROR: Mesa RadeonSI OpenGL driver is missing." >&2
                exit 1
              fi
              if [[ ! -f "$airootfs/usr/share/vulkan/icd.d/radeon_icd.json" ]]; then
                echo "ERROR: RADV Vulkan ICD manifest is missing." >&2
                exit 1
              fi

              echo "PASS: built kernel includes MT7902 Wi-Fi/Bluetooth IDs and firmware."
              echo "PASS: built rootfs includes AMDGPU, RadeonSI OpenGL and RADV Vulkan."
              echo "PASS: AMD and Intel CPU microcode packages are installed."
              printf "Kernel build: "
              find "$modules_dir" -mindepth 1 -maxdepth 1 -type d -printf "%f\n" | head -n 1

              cd /workspace/out
              sha256sum *.iso > SHA256SUMS
            '

      - name: Install UEFI VM test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf

      - name: Boot ISO in a UEFI virtual machine
        run: bash scripts/vm-smoke-test.sh

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: aether-os-alpha-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
